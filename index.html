    <script>
      // Prevent flash of unstyled content by applying theme before page loads
      (function() {
        // Add preload class to prevent transitions during initial load
        document.documentElement.classList.add('preload');

        // Apply theme immediately
        const theme = localStorage.getItem('theme') || 'auto';
        const isDark = theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
        }

        // Set a data attribute to signal that initial theme is applied
        document.documentElement.setAttribute('data-theme-ready', 'true');

        // Remove preload class after React hydration to enable smooth transitions
        window.addEventListener('DOMContentLoaded', function() {
          // Wait for React to mount before removing preload
          requestAnimationFrame(function() {
            setTimeout(function() {
              document.documentElement.classList.remove('preload');
            }, 50);
          });
        });
      })();
    </script>

  <body>
    <div id="root"></div>
    <pre id="bootstrap-diagnostics" data-app-error style="display: none; position: fixed; top: 0; left: 0; right: 0; background: #fee2e2; color: #991b1b; padding: 8px; font-family: monospace; font-size: 12px; z-index: 9999; max-height: 200px; overflow: auto;"></pre>
    <script>
      // Inline bootstrap diagnostics - immediate visibility before module execution
      (function() {
        console.log('[INLINE BOOTSTRAP] DOM ready — awaiting module execution...');
        var diag = document.getElementById('bootstrap-diagnostics');
        if (diag) {
          diag.textContent = '[INLINE BOOTSTRAP] DOM ready — awaiting module execution...';
          diag.style.display = 'block';
        }
        window.addEventListener('error', function(e) {
          var diag = document.getElementById('bootstrap-diagnostics');
          if (diag) {
            diag.textContent += '\\n[ERROR] ' + (e.error || e.message || e);
            diag.style.display = 'block';
          }
        });
        window.addEventListener('unhandledrejection', function(e) {
          var diag = document.getElementById('bootstrap-diagnostics');
          if (diag) {
            diag.textContent += '\\n[PROMISE REJECTION] ' + (e.reason || e);
            diag.style.display = 'block';
          }
        });
      })();
    </script>
    <script type="module" crossorigin src="/src/main.tsx"></script>
