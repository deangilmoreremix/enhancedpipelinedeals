[build]
command = "npm run build"
publish = "dist"

# Production Environment Variables for Twenty CRM
[build.environment]
  NPM_CONFIG_PRODUCTION = "false"
  VITE_SUPABASE_URL = "https://your-production-project.supabase.co"
  VITE_SUPABASE_ANON_KEY = "your-production-anon-key-here"
  VITE_OPENAI_API_KEY = "your-production-openai-api-key"
  VITE_GEMINI_API_KEY = "your-production-gemini-api-key"
  VITE_GOOGLE_CALENDAR_CLIENT_ID = "your-production-google-calendar-client-id"
  VITE_OUTLOOK_CLIENT_ID = "your-production-outlook-client-id"
  VITE_SENDGRID_API_KEY = "your-production-sendgrid-api-key"
  ENVIRONMENT = "production"
  NODE_ENV = "production"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co https://*.openai.com https://*.googleapis.com https://*.elevenlabs.io https://*.composio.dev; frame-ancestors 'none';"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
for = "/*.html"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/static/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.js"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.css"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.png"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.jpg"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.webp"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/sitemap.xml"
[headers.values]
Content-Type = "application/xml"
Cache-Control = "public, max-age=3600"

[[headers]]
for = "/robots.txt"
[headers.values]
Content-Type = "text/plain"
Cache-Control = "public, max-age=3600"